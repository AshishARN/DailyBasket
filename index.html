<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6b4f" />
  <meta
    name="description"
    content="A simple daily grocery list that works offline."
  />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <title>Daily Basket</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">YOUR DAILY LIST</p>
        <h1>Daily Basket</h1>
        <p id="todayLabel" class="today-label"></p>
      </div>

      <button id="installButton" class="icon-button install-button" hidden aria-label="Install Daily Basket">
        <span>↓</span>
      </button>
    </header>

    <section class="add-card" aria-label="Add grocery item">
      <form id="addForm">
        <label class="sr-only" for="itemInput">Grocery item</label>
        <input
          id="itemInput"
          type="text"
          maxlength="80"
          autocomplete="off"
          placeholder="What do you need to buy?"
          required
        />
        <button type="submit" class="add-button" aria-label="Add item">
          <span>+</span>
          Add
        </button>
      </form>
    </section>

    <section class="list-section">
      <div class="section-heading">
        <div>
          <h2>To buy</h2>
          <p id="remainingCount">0 items left</p>
        </div>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">🛒</div>
        <h3>Your basket is empty</h3>
        <p>Add your first grocery item above.</p>
      </div>

      <ul id="activeList" class="grocery-list" aria-live="polite"></ul>
    </section>

    <section class="purchased-section">
      <button id="purchasedToggle" class="purchased-toggle" type="button" aria-expanded="false">
        <span>
          Recently bought
          <small id="purchasedCount">0</small>
        </span>
        <span id="toggleArrow" aria-hidden="true">⌄</span>
      </button>

      <ul id="purchasedList" class="grocery-list purchased-list" hidden></ul>
      <button id="clearBoughtButton" class="clear-button" type="button" hidden>
        Clear bought items
      </button>
    </section>
  </main>

  <template id="activeItemTemplate">
    <li class="grocery-item active-item">
      <button class="buy-button" type="button" aria-label="Mark as bought">
        <span>✓</span>
      </button>
      <div class="item-details">
        <p class="item-name"></p>
        <p class="item-time"></p>
      </div>
      <button class="delete-button" type="button" aria-label="Delete item">×</button>
    </li>
  </template>

  <template id="purchasedItemTemplate">
    <li class="grocery-item bought-item">
      <div class="bought-check" aria-hidden="true">✓</div>
      <div class="item-details">
        <p class="item-name"></p>
        <p class="item-time"></p>
      </div>
      <button class="undo-button" type="button">Undo</button>
    </li>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
